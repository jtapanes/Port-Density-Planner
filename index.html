<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="2;url=https://port-density-planner.jt82.chatgpt.site/" />
    <title>PortDensity — Opening application</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px;
        background: radial-gradient(circle at top, #193c57 0, #071521 48%, #030a11 100%);
        color: #edf8ff;
      }
      main {
        width: min(520px, 100%); padding: 48px 38px; text-align: center;
        background: rgba(9, 29, 43, .82); border: 1px solid rgba(109, 211, 255, .22);
        border-radius: 24px; box-shadow: 0 24px 70px rgba(0, 0, 0, .42);
      }
      .mark { font-size: 42px; }
      h1 { margin: 14px 0 8px; font-size: clamp(30px, 7vw, 46px); letter-spacing: -.04em; }
      p { margin: 0 0 28px; color: #a9c4d5; line-height: 1.6; }
      a {
        display: inline-block; padding: 13px 22px; border-radius: 10px;
        background: #39bdf8; color: #03111b; font-weight: 750; text-decoration: none;
      }
      small { display: block; margin-top: 22px; color: #6f91a5; }
    </style>
    <script>
      window.setTimeout(() => window.location.replace("https://port-density-planner.jt82.chatgpt.site/"), 700);
    </script>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">⚓</div>
      <h1>PortDensity</h1>
      <p>Opening the Shipboard Network Engineering application.</p>
      <a href="https://port-density-planner.jt82.chatgpt.site/">Open PortDensity</a>
      <small>You will be redirected automatically.</small>
    </main>
  </body>
</html>
